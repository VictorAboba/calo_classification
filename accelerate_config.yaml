# Process topology for `accelerate launch`. mixed_precision and dynamo_config below are
# overridden by the `hardware` section of experiment_config.yaml (see hardware.py).
# Regenerate for the current machine: uv run python hardware.py --write-accelerate-config
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: 'NO'
downcast_bf16: 'no'
dynamo_config:
  dynamo_backend: INDUCTOR
enable_cpu_affinity: true
gpu_ids: '0'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
